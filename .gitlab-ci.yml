# Use the acc-py-devtools templates found at
# https://gitlab.cern.ch/acc-co/devops/python/acc-py-gitlab-ci-templates/-/blob/master/v2/python.gitlab-ci.yml

include:
 - project: acc-co/devops/python/acc-py-gitlab-ci-templates
   file: v2/python.gitlab-ci.yml
 - local: .gitlab/renovate.gitlab-ci.yml

variables:
  project_name: "dsb_devtools"
  PY_VERSION: "3.11"
  ACC_PY_BASE_IMAGE_TAG: "2023.06"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

# ========================= Build =========================

build_sdist:
  extends: .acc_py_build_sdist


build_wheel:
  extends: .acc_py_build_wheel


# A development installation of the package tested with pytest.
test_dev:
  extends: .acc_py_dev_test
  script:
    # Run the unit-tests with coverage output.
    - cd ${project_root}
    - python -m pytest ./tests
      --cov=${project_name}
      --cov-report term
      --cov-report html:coverage-html
      --cov-report xml:coverage-report.xml
      --junitxml=junit-report.xml


test_wheel:
  extends:
    - .acc_py_wheel_test
  needs:
    - build_wheel
  script:
    - mkdir -p ~/not-the-source-dir && cp -r ${project_root}/tests ~/not-the-source-dir && cd ~/not-the-source-dir
    - python -m pytest ./tests


._build_docs:
  variables:
    SPHINX_BUILD_ADDOPTS: "-W --keep-going"  # Error if we have warnings in the doc build.
  needs:
    - build_wheel


build_docs:
  extends:
    - ._build_docs
    - .acc_py_build_docs


build_docs_on_tag:
  extends:
    - ._build_docs
    - .acc_py_build_docs_on_tag


pre-commit:
  extends: .acc_py_pre-commit


release_dist:
  extends: .acc_py_publish


# ========================= Renovate image =========================

build_renovate_image:
  stage: .pre
  image: docker:latest
  variables:
    INTERNAL_TAG: "2026.04"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  services:
    - docker:dind
  script:
    - apk add --no-cache yq
    - RENOVATE_TAG=$(yq ".[\"${INTERNAL_TAG}\"]" .gitlab/renovate-versions.yml)
    - |
      if [ -z "$RENOVATE_TAG" ] || [ "$RENOVATE_TAG" = "null" ]; then
        echo "ERROR: No upstream tag found for internal tag '${INTERNAL_TAG}' in .gitlab/renovate-versions.yml"
        exit 1
      fi
    - echo "Building registry.cern.ch/dsb-devtools/renovate:${INTERNAL_TAG} from renovate/renovate:${RENOVATE_TAG}"
    - docker build
        --build-arg RENOVATE_TAG=${RENOVATE_TAG}
        -t registry.cern.ch/dsb-devtools/renovate:${INTERNAL_TAG}
        -f .gitlab/Dockerfile.renovate .
    - docker push registry.cern.ch/dsb-devtools/renovate:${INTERNAL_TAG}
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never
